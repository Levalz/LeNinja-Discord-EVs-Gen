vpn: false
vpn_delay: 120
# How many accounts to generate in parallel. Default 1 = serial (safe,
# same as before). Bump only when your proxy pool has that many alive
# proxies AND your extension key has enough credit — each worker uses
# one browser instance and one solve credit per attempt. Enabling
# workers > 1 disables Mullvad VPN rotation automatically (single-tunnel).
# Override at runtime with `python main.py <target> <workers>`.
workers: 1
# Hard cap on a single account attempt (seconds). Kills stalled browsers
# or captcha loops that never terminate. Kept generous by default.
attempt_timeout: 240
cybertemp_key: ""
draxon_key: ""
hotmail007_key: ""
# Which Hotmail007 product to buy. The default "hotmail" sells BASIC
# accounts (email:password only), which cannot have their inbox read — you
# need an OAuth product returning email:password:refresh_token:client_id.
# Product names are broker-specific and NOT guessable: run
#   python main.py --list-mailtypes
# to ask the broker for its list, or read it off your Hotmail007 dashboard.
hotmail007_mail_type: "hotmail"

zeusx_key: ""
# Same idea for Zeus-X: pick an account code whose product includes OAuth
# credentials, not just email:password.
zeusx_account_code: "HOTMAIL"
afham_mail_api9_key: ""
duckmail_key: ""
crowmail_key: ""

# AI CAPTCHA fallback keys. The LeNinja/Nopecha extension solves first;
# these run only if the extension fails. Leave empty to disable.
# Groq deprecates preview model IDs frequently — check
# https://console.groq.com/docs/models and set groq_model to a current
# vision-capable model. Same for anthropic_model (claude vision model).
groq_key: ""
groq_model: ""          # empty = solver's built-in default
anthropic_key: ""
anthropic_model: ""     # empty = solver's built-in default
captcha_extension_wait: 60
# How long to wait for Discord to RENDER a challenge after the form is
# submitted. Discord loads the hCaptcha iframe after the POST, so a short
# window here makes the flow walk past a challenge that is still loading
# and leave it unsolved on screen. Raise if you're on a slow proxy.
captcha_appear_wait: 25

# Preferred browser (Brave, Chrome, Chromium, Edge). Leave empty to
# auto-detect the first installed one in that default order.
browser: ""

proxy:
  enabled: false
  file: input/proxies.txt
